# Gradle requires JDK 17. JDK 25+ will fail Kotlin DSL compilation.
# org.gradle.java.home is set via JAVA_HOME environment variable
# Uncomment and set after installing Temurin 17 locally:
# org.gradle.java.home=C\:\\Program Files\\Eclipse Adoptium\\jdk-17.0.19.10-hotspot
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8 -Dsun.jnu.encoding=UTF-8
android.useAndroidX=true
android.enableJetifier=true
android.overridePathCheck=true
kotlin.code.style=official
kotlin.incremental=false
kotlin.compiler.execution.strategy=in-process
kotlin.daemon.jvmargs=-Dkotlin.environment.keepalive=false
org.gradle.parallel=true
org.gradle.caching=true
