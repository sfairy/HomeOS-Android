name: Android CI

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Type'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    
    - name: Create keystore file from base64
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      run: |
        if [ -n "$KEYSTORE_BASE64" ]; then
          echo "$KEYSTORE_BASE64" | base64 -d > app/homeos-release-key.jks
        fi
    
    - name: Build with Gradle
      run: ./gradlew assemble${{ inputs.build_type == 'release' && 'Release' || 'Debug' }}
    
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: HomeOSAPP
        path: app/build/outputs/apk/${{ inputs.build_type }}/*.apk