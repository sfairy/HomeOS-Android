name: Android CI

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Type'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    
    - name: Create keystore file from base64
      if: inputs.build_type == 'release'
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      run: |
        if [ -z "$KEYSTORE_BASE64" ]; then
          echo "::error::Release 正式签名需要在仓库 Secrets 中配置 KEYSTORE_BASE64"
          echo "本地运行 scripts/export-keystore-base64.ps1 生成并上传"
          exit 1
        fi
        echo "$KEYSTORE_BASE64" | base64 --decode > app/homeos-release-key.jks
        if [ ! -s app/homeos-release-key.jks ]; then
          echo "::error::KEYSTORE_BASE64 解码失败，请检查 Secret 内容是否完整"
          exit 1
        fi
        echo "Release keystore configured ($(wc -c < app/homeos-release-key.jks) bytes)."
    
    - name: Build with Gradle
      env:
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      run: ./gradlew assemble${{ inputs.build_type == 'release' && 'Release' || 'Debug' }}
    
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: HomeOSAPP
        path: app/build/outputs/apk/${{ inputs.build_type }}/*.apk
